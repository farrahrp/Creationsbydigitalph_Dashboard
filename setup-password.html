<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set Password | Creations by Digital PH</title>
<style>
:root{--red:#bf3431;--dark:#9b1f1d;--ink:#222;--muted:#666}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{font:16px/1.6 Arial,Helvetica,sans-serif;margin:0;color:var(--ink);background:#fff}
header{padding:14px 12px 24px;border-bottom:1px solid #e6e6e6;font-weight:700;font-size:20px}
main{max-width:640px;margin:0 auto;padding:70px 24px 80px}
h1{font:56px/1.05 Impact,'Arial Narrow',sans-serif;font-weight:400;margin:0 0 24px}
h1 em{color:var(--red);font-style:normal}
label{display:block;margin:0 0 8px;font-size:17px}
input{display:block;width:100%;border:1px solid #ccc;padding:0 16px;height:46px;font:inherit;font-size:17px;margin:0 0 22px}
button{font:inherit;font-size:17px;cursor:pointer;background:var(--red);color:#fff;border:1px solid var(--red);padding:0 28px;height:46px}
button:hover{background:var(--dark)}button:disabled{opacity:.6;cursor:default}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #e99599;outline-offset:2px}
.msg{margin:16px 0 24px;color:#333;min-height:24px}
a{color:var(--dark)}
@media(max-width:640px){main{padding-top:40px}h1{font-size:44px}}
</style>
</head>
<body>
<header>CREATIONS by Digital PH</header>
<main>
  <h1>Set your <em>password.</em></h1>
  <p class="msg" id="msg" role="status">Checking your invitation...</p>
  <form id="form" hidden>
    <label for="password">New password (at least 12 characters)</label>
    <input id="password" type="password" minlength="12" autocomplete="new-password" required>
    <label for="confirm">Confirm password</label>
    <input id="confirm" type="password" minlength="12" autocomplete="new-password" required>
    <button id="save" type="submit">Save password</button>
  </form>
  <p><a href="login.html">Go to login</a></p>
</main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const sb = window.supabase.createClient(PORTAL_CONFIG.url, PORTAL_CONFIG.key);
const $ = id => document.getElementById(id);

(async function () {
  // the library reads the invite or reset link from the address bar on load
  const { data } = await sb.auth.getSession();
  if (!data.session) {
    $('msg').textContent = 'This link has expired or was already used. Go to login and choose "Set or reset password by email" to get a new one.';
    return;
  }
  history.replaceState(null, '', location.pathname);
  $('form').hidden = false;
  $('msg').textContent = 'Choose your new password.';
})();

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const p = $('password').value;
  if (p.length < 12) { $('msg').textContent = 'Use at least 12 characters.'; return; }
  if (p !== $('confirm').value) { $('msg').textContent = 'Passwords do not match.'; return; }
  $('save').disabled = true; $('msg').textContent = 'Saving...';
  const { error } = await sb.auth.updateUser({ password: p });
  if (error) { $('msg').textContent = 'Could not save the password. Request a fresh link from the login page.'; $('save').disabled = false; return; }
  location.replace('dashboard.html');
});
</script>
</body>
</html>
