<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set Password | Creations by Digital PH</title><style>body{font:16px Arial;margin:0;color:#222}header{padding:25px;border-bottom:1px solid #ddd}main{max-width:510px;margin:65px auto;padding:20px}h1{font:46px Impact,Arial;color:#cf2027}input{display:block;width:95%;padding:13px;margin:10px 0 20px;border:1px solid #ddd}button{background:#cf2027;color:white;border:0;padding:13px 24px}a{color:#cf2027}</style></head><body><header>CREATIONS by Digital PH</header><main><h1>Set your password</h1><p id="message">Checking invitation...</p><form id="form" hidden><label>New password (at least 12 characters)<input type="password" minlength="12" id="password" required autocomplete="new-password"></label><label>Confirm password<input type="password" minlength="12" id="confirm" required autocomplete="new-password"></label><button>Save password</button></form><p><a href="login.html">Go to login</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const client=window.supabase.createClient("https://enapawxhzizzefnfebco.supabase.co","sb_publishable_9xZHzw1SFJVqTAcQuxic8w_sWhNqS1N");
const msg=document.getElementById("message"),form=document.getElementById("form");
async function initialize(){
 if(!client){msg.textContent="Authentication service unavailable. Refresh and try again.";return;}
 const search=new URLSearchParams(location.search);
 const hash=new URLSearchParams(location.hash.slice(1));
 if(search.get("error")||hash.get("error")){
  msg.textContent="This recovery link was rejected or has expired. Please request a new link.";
  return;
 }
 try{
  const tokenHash=search.get("token_hash");
  const tokenType=search.get("type")||hash.get("type")||"recovery";
  if(tokenHash){
   const {error}=await client.auth.verifyOtp({token_hash:tokenHash,type:tokenType==="invite"?"invite":"recovery"});
   if(error)throw error;
  }else if(search.get("code")){
   // Supabase-js normally detects the code automatically; first ask it for the session.
   const {data:initial}=await client.auth.getSession();
   if(!initial?.session){
    const {error}=await client.auth.exchangeCodeForSession(search.get("code"));
    if(error)throw error;
   }
  }else if(hash.get("access_token")&&hash.get("refresh_token")){
   const {error}=await client.auth.setSession({access_token:hash.get("access_token"),refresh_token:hash.get("refresh_token")});
   if(error)throw error;
  }
  const {data,error}=await client.auth.getUser();
  if(error||!data?.user){
   msg.textContent="A valid recovery session was not found. Please request a new password email.";
   return;
  }
  form.hidden=false;
  msg.textContent="Your account is verified. Choose a new password.";
  history.replaceState(null,"",location.pathname);
 }catch(error){
  msg.textContent="This link could not be verified or has already been used. Request a new password email.";
 }
}
form.onsubmit=async(e)=>{e.preventDefault();const password=document.getElementById("password").value;if(password!==document.getElementById("confirm").value){msg.textContent="Passwords do not match.";return;}const {error}=await client.auth.updateUser({password});if(error){msg.textContent="Could not update password. Please request a fresh link.";return;}location.replace("dashboard.html");};initialize();
</script></body></html>
